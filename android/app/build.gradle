apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def signingProfile = System.getenv('PENGUIN_SIGNING_PROFILE')?.trim()
def signingCredentialsPath = System.getenv('PENGUIN_SIGNING_CREDENTIALS_FILE')?.trim()
if ((signingProfile && !signingCredentialsPath) || (!signingProfile && signingCredentialsPath)) {
    throw new GradleException('PENGUIN_SIGNING_PROFILE and PENGUIN_SIGNING_CREDENTIALS_FILE must be set together')
}
def hasExternalSigning = signingProfile && signingCredentialsPath

if (hasExternalSigning) {
    def signingCredentialsFile = file(signingCredentialsPath)
    if (!signingCredentialsFile.exists()) {
        throw new GradleException('PENGUIN_SIGNING_CREDENTIALS_FILE does not exist')
    }
    def signingCredentials = new JsonSlurper().parse(signingCredentialsFile)
    def signingKeys = signingCredentials instanceof Map ? signingCredentials['keys'] : null
    def selectedProfile = signingKeys instanceof Map ? signingKeys[signingProfile] : null
    if (!(selectedProfile instanceof Map)) {
        throw new GradleException("Unknown PENGUIN_SIGNING_PROFILE: ${signingProfile}")
    }
    def selectedKeystore = new File(String.valueOf(selectedProfile.keystore))
    if (!selectedKeystore.isAbsolute()) {
        selectedKeystore = new File(signingCredentialsFile.parentFile, String.valueOf(selectedProfile.keystore))
    }
    keystoreProperties['storeFile'] = selectedKeystore.absolutePath
    keystoreProperties['storePassword'] = selectedProfile.storePassword
    keystoreProperties['keyAlias'] = selectedProfile.alias
    keystoreProperties['keyPassword'] = selectedProfile.keyPassword
} else if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasReleaseSigning = hasExternalSigning || keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!keystoreProperties[key]) {
            throw new GradleException("Missing release signing value: ${key}")
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException('Release signing credentials are required for every release build')
    }
}

android {
    namespace = "com.jellysnow.penguinbounce"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jellysnow.penguinbounce"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
